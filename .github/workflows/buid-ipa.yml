
name: Build PEDINHIOS MENU IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          xcodebuild \
            -project PEDINHIOS.xcodeproj \
            -scheme PEDINHIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r PEDINHIOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PEDINHIOS-unsigned-IPA
          path: build/PEDINHIOS-unsigned.ipa
